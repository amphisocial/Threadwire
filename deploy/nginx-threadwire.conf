# /etc/nginx/sites-available/threadwire
# Four-service layout: apex serves the marketing app (tw-home :4000); each
# product subdomain proxies to its PM2 service. /api/ everywhere -> FastAPI
# (uvicorn :8000). The per-app static-server.js handles SPA fallback + asset
# caching, so nginx just proxies.
#
# APPLY ORDER:
#   1) install this file, `sudo nginx -t && sudo systemctl reload nginx`
#      (apex works immediately on its existing cert; subdomains are HTTP-only)
#   2) certbot upgrades the three subdomains to HTTPS + adds redirects:
#      sudo certbot --nginx \
#        -d delivery.threadwire.ai \
#        -d workforce.threadwire.ai \
#        -d requirements.threadwire.ai
#   (add -d threadwire.ai -d www.threadwire.ai too if you want certbot to
#    also refresh the apex cert; not required since it already exists.)

# ---- shared proxy snippet is inlined per block for clarity ----

# =========================== APEX / MARKETING (tw-home :4000) ===============
server {
    listen 80;
    listen [::]:80;
    server_name threadwire.ai www.threadwire.ai;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name threadwire.ai www.threadwire.ai;

    ssl_certificate     /etc/letsencrypt/live/threadwire.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threadwire.ai/privkey.pem;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =========================== DELIVERY (tw-delivery :4001) ====================
# HTTP-only for now; `certbot --nginx -d delivery.threadwire.ai` adds the 443
# block + redirect automatically.
server {
    listen 80;
